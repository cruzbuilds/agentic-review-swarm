---
name: swarm
description: Runs every configured review agent (security, docs, infra, test, scope, systems) on a change in parallel, then arbitrates their reports into one verdict, a findings list and an assurance record. Any single BLOCK is a BLOCK; a missing reviewer caps the verdict at WARN. Reviews nothing itself.
tools:
  - read
  - subagent
allowedTools:
  - read
  - subagent
toolsSettings:
  subagent:
    availableAgents:
      - "security-reviewer"
      - "docs-reviewer"
      - "infra-reviewer"
      - "test-reviewer"
      - "scope-reviewer"
      - "systems-reviewer"
    trustedAgents:
      - "*-reviewer"
---
