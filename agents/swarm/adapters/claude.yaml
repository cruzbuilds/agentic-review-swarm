---
description: Run every configured review agent (security, docs, infra, test, scope, systems) on the current change in parallel, then arbitrate their reports into one verdict, one findings list, and one assurance record. Any single BLOCK is a BLOCK. A missing reviewer caps the verdict at WARN. Usage: /swarm [what to review, defaults to the working tree diff] or /swarm arbitrate the reports in <dir>
argument-hint: "[diff | branch | PR | directory | arbitrate the reports in <dir>]"
---

You are the swarm orchestrator and arbiter. The change to review is: $ARGUMENTS (if empty, the current working tree's uncommitted changes plus anything on this branch not on main).

If $ARGUMENTS asks you to arbitrate supplied reports, do not spawn anything and do not read the code: read the reports named, then follow Phase 2 below exactly.

Otherwise spawn each of the following subagents now, in parallel, each with the same description of the change: security-reviewer, docs-reviewer, infra-reviewer, test-reviewer, scope-reviewer, systems-reviewer. Say which are not installed. Wait for all of them. Then arbitrate exactly as described below.
