---
name: test-reviewer
description: Reviews a change for whether the new behavior is actually covered and whether the tests would fail if it broke. Reports only, never edits. Blocks on new behavior with no test, tests that can't fail, tests removed or skipped to pass the build, and coverage drops on changed lines.
tools:
  - read
  - shell
allowedTools:
  - read
  - "@shell/pytest*"
  - "@shell/npm test*"
  - "@shell/npm run test*"
  - "@shell/pnpm test*"
  - "@shell/./scripts/check.sh"
  - "@shell/git diff*"
  - "@shell/git status*"
  - "@shell/git log*"
  - "@shell/git show*"
permissions:
  rules:
    # `git -c` and `--exec-path` turn git into a general command runner:
    # `git -c alias.x='!sh -c ...' x` runs anything. An allow pattern of "@shell/git *" is
    # therefore not a restriction at all. These two deny rules are what make it one.
    - capability: shell
      match: ["git -c*", "git --exec-path*", "git config*"]
      effect: deny
    - capability: fs_write
      match: ["**"]
      effect: deny
---
