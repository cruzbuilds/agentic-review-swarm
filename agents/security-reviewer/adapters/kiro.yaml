---
name: security-reviewer
description: Reviews a code change for ways it can be attacked or leak secrets. Reports only, never edits. Blocks on credentials in source, injection, missing auth, over-broad IAM, static cloud keys in CI, and critical dependency vulnerabilities.
tools:
  - read
  - shell
allowedTools:
  - read
  - "@shell/git diff*"
  - "@shell/git status*"
  - "@shell/git log*"
  - "@shell/git show*"
  - "@shell/git ls-files*"
  - "@shell/gitleaks *"
  - "@shell/semgrep *"
  - "@shell/npm audit*"
  - "@shell/pip-audit*"
permissions:
  rules:
    # `git -c` and `--exec-path` turn git into a general command runner:
    # `git -c alias.x='!sh -c ...' x` runs anything. An allow pattern of "@shell/git *" is
    # therefore not a restriction at all. These two deny rules are what make it one.
    - capability: shell
      match: ["git -c*", "git --exec-path*", "git config*"]
      effect: deny
    - capability: fs_write
      match: ["**"]
      effect: deny
---
