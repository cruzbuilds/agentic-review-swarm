---
name: scope-reviewer
description: Reviews a change against engagement/03-scope.md and docs/decisions/ for whether it was supposed to be built and whether big choices were recorded. Reports only, never edits. Blocks on out-of-scope work, constraining decisions with no ADR, and unjustified dependencies. Returns PASS with a note if the repo has no engagement folder.
tools:
  - read
  - shell
allowedTools:
  - read
  - "@shell/git diff*"
  - "@shell/git status*"
  - "@shell/git log*"
  - "@shell/git show*"
permissions:
  rules:
    # `git -c` and `--exec-path` turn git into a general command runner:
    # `git -c alias.x='!sh -c ...' x` runs anything. An allow pattern of "@shell/git *" is
    # therefore not a restriction at all. These two deny rules are what make it one.
    - capability: shell
      match: ["git -c*", "git --exec-path*", "git config*"]
      effect: deny
    - capability: fs_write
      match: ["**"]
      effect: deny
---
